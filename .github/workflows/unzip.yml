name: Auto Unzip

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip all zip files
        run: |
          find . \
            -name "*.zip" \
            -not -path "./.git/*" \
          | while read zipfile; do
              echo "Unzipping: $zipfile"
              dir="${zipfile%.zip}"
              mkdir -p "$dir"
              unzip -o "$zipfile" -d "$dir"
              rm "$zipfile"
              echo "Done: $zipfile → $dir/"
            done

      - name: Commit extracted files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "auto: unzip and extract files [skip ci]"
            git push
          fi
