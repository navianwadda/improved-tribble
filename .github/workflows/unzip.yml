name: Auto Unzip

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip all zip files
        run: |
          find . \
            -name "*.zip" \
            -not -path "./.git/*" \
          | while read zipfile; do
              echo "Unzipping: $zipfile"
              target="${zipfile%.zip}"
              tmpdir=$(mktemp -d)
              unzip -o "$zipfile" -d "$tmpdir"
              rm "$zipfile"

              # If zip extracted into a single top-level folder, flatten it
              count=$(ls -A "$tmpdir" | wc -l)
              first="$tmpdir/$(ls -A "$tmpdir" | head -1)"

              if [ "$count" -eq 1 ] && [ -d "$first" ]; then
                echo "Flattening: $first → $target/"
                mv "$first" "$target"
              else
                mv "$tmpdir" "$target"
              fi

              rm -rf "$tmpdir"
              echo "Done: $zipfile → $target/"
            done

      - name: Commit extracted files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "auto: unzip and extract files [skip ci]"
            git push
          fi
